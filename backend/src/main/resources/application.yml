spring:
  application:
    name: photoshare

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/photoshare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:photoshare}
    password: ${DB_PASSWORD:photoshare}
    hikari:
      maximum-pool-size: 10
      pool-name: photoshare-pool

  jpa:
    hibernate:
      # Fine for this exercise. A production rollout would use Flyway migrations
      # (see docs/schema.sql for the exact schema this generates).
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          batch_size: 25

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 400MB
      file-size-threshold: 2MB

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
  tomcat:
    max-swallow-size: 400MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-32-chars-min}
    access-token-minutes: ${JWT_ACCESS_MINUTES:720}
    gallery-token-minutes: ${JWT_GALLERY_MINUTES:120}

  storage:
    # local | s3
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:ap-south-1}
    endpoint: ${S3_ENDPOINT:}
    signed-url-minutes: ${SIGNED_URL_MINUTES:30}

  upload:
    allowed-content-types: image/jpeg,image/png,image/webp,image/heic
    max-file-size-bytes: 26214400
    max-files-per-request: 50

  gallery:
    pin-length: 6
    max-pin-attempts: 5
    pin-lockout-minutes: 15

  demo:
    seed: ${DEMO_SEED:true}
    admin-email: ${DEMO_ADMIN_EMAIL:admin@trizen-ai.com}
    admin-password: ${DEMO_ADMIN_PASSWORD:Admin@12345}
    member-email: ${DEMO_MEMBER_EMAIL:photographer@trizen-ai.com}
    member-password: ${DEMO_MEMBER_PASSWORD:Member@12345}

logging:
  level:
    com.trizen.photoshare: INFO
