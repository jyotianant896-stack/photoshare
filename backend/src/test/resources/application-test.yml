spring:
  datasource:
    url: jdbc:h2:mem:photoshare;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB

app:
  jwt:
    secret: test-secret-value-that-is-long-enough-for-hmac-sha256
  storage:
    type: local
    local-dir: ./target/test-uploads
  demo:
    seed: false

logging:
  level:
    root: WARN
